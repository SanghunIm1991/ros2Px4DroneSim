<text x="645" y="412" text-anchor="middle" font-size="13">経由点</text>
<text x="645" y="457" text-anchor="middle" font-size="13">機体の位置</text>
<text x="985" y="432" text-anchor="middle" font-size="13">地図・経路</text>
</g></svg>
