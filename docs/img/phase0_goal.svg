<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 520" width="1290" height="520" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="この教材の最終ゴール（フェーズ6）の構成の見通し。Gazebo（フェーズ4）が、2DのLiDAR付きの機体 x500_lidar_2d と壁のワールド walls を計算する。ros_gz_bridge（フェーズ4）がLiDARの距離の値をROS 2へ中継し、地図と経路計画のノード（フェーズ6）が壁を見つけたら経路を計画し直す。経由点を送るノード（フェーズ3）が、ENUをNEDに直した目標の位置を、Micro XRCE-DDS Agent（フェーズ2）を通してPX4（SITL、フェーズ1・3）へ送り続け、機体の位置を受け取る。RViz2（フェーズ4・6）が壁の形と経路を表示し、QGroundControlが機体の状態を見守る">
<title>この教材の最終ゴール（フェーズ6）の構成の見通し。Gazebo（フェーズ4）が、2DのLiDAR付きの機体 x500_lidar_2d と壁のワールド walls を計算する。ros_gz_bridge（フェーズ4）がLiDARの距離の値をROS 2へ中継し、地図と経路計画のノード（フェーズ6）が壁を見つけたら経路を計画し直す。経由点を送るノード（フェーズ3）が、ENUをNEDに直した目標の位置を、Micro XRCE-DDS Agent（フェーズ2）を通してPX4（SITL、フェーズ1・3）へ送り続け、機体の位置を受け取る。RViz2（フェーズ4・6）が壁の形と経路を表示し、QGroundControlが機体の状態を見守る</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#333333"/></marker></defs>
<rect x="0" y="0" width="1290" height="520" fill="#ffffff"/>
<g fill="#1a1a1a">
<path d="M250,80 L360,80" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#s)"/>
