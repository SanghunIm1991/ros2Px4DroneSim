<text x="815" y="254" text-anchor="middle">LiDARの値を</text>
<text x="815" y="274" text-anchor="middle">ROS 2へ中継する</text>
<text x="815" y="296" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ4</text>
<text x="475" y="414" text-anchor="middle" font-weight="bold">経由点を送るノード</text>
<text x="475" y="434" text-anchor="middle">ENUをNEDに直して</text>
<text x="475" y="454" text-anchor="middle">目標の位置を送り続ける</text>
<text x="475" y="476" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ3</text>
<text x="815" y="414" text-anchor="middle" font-weight="bold">地図と経路計画のノード</text>
<text x="815" y="434" text-anchor="middle">LiDARで壁を見つけたら</text>
<text x="815" y="454" text-anchor="middle">経路を計画し直す</text>
<text x="815" y="476" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ6</text>
<text x="1155" y="414" text-anchor="middle" font-weight="bold">RViz2</text>
<text x="1155" y="434" text-anchor="middle">壁の形と経路を</text>
<text x="1155" y="454" text-anchor="middle">表示する</text>
<text x="1155" y="476" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ4・6</text>
<text x="305" y="72" text-anchor="middle" font-size="13">MAVLink</text>
<text x="645" y="72" text-anchor="middle" font-size="13">物理の計算</text>
<text x="483" y="175" text-anchor="start" font-size="13">uXRCE-DDS</text>
<text x="483" y="355" text-anchor="start" font-size="13">目標の位置／機体の位置</text>
