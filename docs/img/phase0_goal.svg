<path d="M475,320 L475,380" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#s)"/>
<path d="M815,140 L815,200" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M815,320 L815,380" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M700,420 L590,420" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M590,465 L700,465" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M930,440 L1040,440" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="20" y="20" width="230" height="120" rx="8" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<rect x="360" y="20" width="230" height="120" rx="8" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<rect x="700" y="20" width="230" height="120" rx="8" fill="#eef7ee" stroke="#3a8a3a" stroke-width="1.5"/>
<rect x="360" y="200" width="230" height="120" rx="8" fill="#f3eefa" stroke="#7a5aa6" stroke-width="1.5"/>
<rect x="700" y="200" width="230" height="120" rx="8" fill="#f3eefa" stroke="#7a5aa6" stroke-width="1.5"/>
<rect x="360" y="380" width="230" height="120" rx="8" fill="#f3eefa" stroke="#7a5aa6" stroke-width="1.5"/>
<rect x="700" y="380" width="230" height="120" rx="8" fill="#f3eefa" stroke="#7a5aa6" stroke-width="1.5"/>
<rect x="1040" y="380" width="230" height="120" rx="8" fill="#f3eefa" stroke="#7a5aa6" stroke-width="1.5"/>
<text x="135" y="64" text-anchor="middle" font-weight="bold">QGroundControl</text>
<text x="135" y="84" text-anchor="middle">機体の状態を見守る</text>
<text x="135" y="106" text-anchor="middle" fill="#9a3412" font-weight="bold">全段階（フェーズ1から）</text>
<text x="475" y="54" text-anchor="middle" font-weight="bold">PX4（SITL）</text>
<text x="475" y="74" text-anchor="middle">オフボード制御で</text>
<text x="475" y="94" text-anchor="middle">経由点へ飛ぶ</text>
<text x="475" y="116" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ1・3</text>
<text x="815" y="54" text-anchor="middle" font-weight="bold">Gazebo</text>
<text x="815" y="74" text-anchor="middle">x500_lidar_2d と</text>
<text x="815" y="94" text-anchor="middle">ワールド walls</text>
<text x="815" y="116" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ4</text>
<text x="475" y="234" text-anchor="middle" font-weight="bold">Micro XRCE-DDS Agent</text>
<text x="475" y="254" text-anchor="middle">PX4とROS 2を</text>
