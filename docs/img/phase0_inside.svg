<title>PX4の中の流れ。行き先を決めるもの（QGroundControl・送信機・ROS 2のノード）から目標が届き、飛行モードがどの目標に従うかを選ぶ。位置と速度の制御が傾きと推力を決め、姿勢と角速度の制御がトルクを決め（推力はそのまま渡す）、配分が各モーターの回転に直す。機体が動くとセンサが値を出し、推定（EKF2）が位置・速度・姿勢を推定して、制御に返す。SITLでは、機体とセンサをGazeboが計算する</title>
