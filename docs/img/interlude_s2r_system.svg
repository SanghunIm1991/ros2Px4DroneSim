<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 550" width="1160" height="550" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="実機の構成の例。中央の列はフライトコントローラの側で、上の「フライトコントローラにつなぐ部品」（GPS・磁気センサ・衝突防止の距離センサ）が、シリアル・I2C・CANで、中央のフライトコントローラ（PX4。推定・制御・フェイルセーフ）につながり、PX4はPWM・DShotで、下のESC・モーターを回す。右の列はコンパニオンコンピュータの側で、上の「コンパニオンにつなぐ部品」（LiDAR・深度カメラ・VIOのカメラ）が、USB・Ethernetで、中央のコンパニオンコンピュータ（Linux・ROS 2。Agent・ドライバのノード・計画器・自作のノード）につながる。フライトコントローラとコンパニオンコンピュータは、uXRCE-DDS（シリアルかEthernet）でつながる。左の列は人の側で、地上局（QGC）は無線のMAVLinkでフライトコントローラとやり取りし、送信機は無線でフライトコントローラに操縦を送る">
<title>実機の構成の例。中央の列はフライトコントローラの側で、上の「フライトコントローラにつなぐ部品」（GPS・磁気センサ・衝突防止の距離センサ）が、シリアル・I2C・CANで、中央のフライトコントローラ（PX4。推定・制御・フェイルセーフ）につながり、PX4はPWM・DShotで、下のESC・モーターを回す。右の列はコンパニオンコンピュータの側で、上の「コンパニオンにつなぐ部品」（LiDAR・深度カメラ・VIOのカメラ）が、USB・Ethernetで、中央のコンパニオンコンピュータ（Linux・ROS 2。Agent・ドライバのノード・計画器・自作のノード）につながる。フライトコントローラとコンパニオンコンピュータは、uXRCE-DDS（シリアルかEthernet）でつながる。左の列は人の側で、地上局（QGC）は無線のMAVLinkでフライトコントローラとやり取りし、送信機は無線でフライトコントローラに操縦を送る</title>
