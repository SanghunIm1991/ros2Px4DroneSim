<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1410 1494" width="1410" height="1494" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="フェーズ6のノード ReplanFlight のクラス図。ReplanFlight は rclpy の Node を受け継ぐ。左の2つの型（位置の VehicleLocalPosition と状態の VehicleStatus）を、センサ向けのQoSで購読する。右の3つの型（合図・目標・指令）をPX4へ送り、2つのTF（map から base_link、base_link から link）を送り、Nav2の計画器 planner_server に、アクション compute_path_to_pose で経路を頼んで、経路を受け取る。メソッドは、作る、PX4とのやりとり、TF、経路の計画、経路をたどる、段階を進める、の6つの役割に分けてある。同じファイルの定数を読み、座標の変換などの関数を使う。下の補足は、0.1秒ごとの on_timer の流れと、0.5秒ごとの計画の流れを示す">
<title>フェーズ6のノード ReplanFlight のクラス図。ReplanFlight は rclpy の Node を受け継ぐ。左の2つの型（位置の VehicleLocalPosition と状態の VehicleStatus）を、センサ向けのQoSで購読する。右の3つの型（合図・目標・指令）をPX4へ送り、2つのTF（map から base_link、base_link から link）を送り、Nav2の計画器 planner_server に、アクション compute_path_to_pose で経路を頼んで、経路を受け取る。メソッドは、作る、PX4とのやりとり、TF、経路の計画、経路をたどる、段階を進める、の6つの役割に分けてある。同じファイルの定数を読み、座標の変換などの関数を使う。下の補足は、0.1秒ごとの on_timer の流れと、0.5秒ごとの計画の流れを示す</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#333333"/></marker><marker id="t" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#333333" stroke-width="1.2"/></marker></defs>
<rect x="0" y="0" width="1410" height="1494" fill="#ffffff"/>
<g fill="#1a1a1a">
<path d="M700,134 L700,100" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#t)"/>
<path d="M350,194 L450,194" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M350,304 L450,304" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M450,434 L350,434" fill="none" stroke="#333333" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#a)"/>
<path d="M950,194 L1050,194" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M950,298 L1050,298" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M950,402 L1050,402" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M950,536 L1050,536" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M950,660 L1050,660" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M1050,710 L950,710" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M950,844 L1050,844" fill="none" stroke="#333333" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#a)"/>
<path d="M700,994 L700,1034" fill="none" stroke="#333333" stroke-width="1.6" stroke-dasharray="6,4"/>
<rect x="560" y="20" width="280" height="80" rx="8" fill="#f3eefa" stroke="#7a5aa6" stroke-width="1.5"/>
<text x="700" y="44" text-anchor="middle" font-weight="bold">Node（rclpy）</text>
<line x1="560" y1="60" x2="840" y2="60" stroke="#7a5aa6" stroke-width="1.2"/>
<text x="700" y="84" text-anchor="middle">ROS 2のノードの元になるクラス</text>
<rect x="450" y="134" width="500" height="860" rx="8" fill="#f3eefa" stroke="#7a5aa6" stroke-width="1.5"/>
<text x="460" y="158" font-weight="bold">ReplanFlight</text>
<line x1="450" y1="174" x2="950" y2="174" stroke="#7a5aa6" stroke-width="1.2"/>
<text x="460" y="198">mode_pub・setpoint_pub・command_pub: PX4への送り手</text>
<text x="460" y="218">tf_pub・static_tf_pub: TFの送り手（右）</text>
<text x="460" y="238">planner: 計画器のアクションのクライアント（右）</text>
<text x="460" y="258">position・status: 最後に届いた位置・状態（左）</text>
<text x="460" y="278">home: 離陸した地点　yaw: 機首を向ける向き</text>
<text x="460" y="298">path: 最後に届いた経路（ENUの点の並び）</text>
<text x="460" y="318">hold: 経路が無い間に止まる位置</text>
<text x="460" y="338">planning: 計画の答えを待っているか</text>
<text x="460" y="358">climbed・started・landing: 段階の目印</text>
<text x="460" y="378">cycles: 経路が届いてから数えた回数</text>
<text x="460" y="398">timer（0.1秒）・plan_timer（0.5秒）: タイマー</text>
<line x1="450" y1="414" x2="950" y2="414" stroke="#7a5aa6" stroke-width="1.2"/>
<text x="460" y="438">■ 作る</text>
<text x="460" y="458">__init__(): 送り手・受け手・クライアント・タイマー</text>
<line x1="450" y1="474" x2="950" y2="474" stroke="#7a5aa6" stroke-width="1.2"/>
<text x="460" y="498">■ PX4とのやりとり</text>
<text x="460" y="518">on_position(msg): 位置を覚え、TFを送る</text>
<text x="460" y="538">on_status(msg): 状態を覚える</text>
<text x="460" y="558">send_setpoint(east, north, yaw): 合図と目標</text>
<text x="460" y="578">send_command(command, ...): 指令を送る</text>
<text x="460" y="598">enu_position()・enu_heading(): ENUの位置と向き</text>
<text x="460" y="618">engaged(): Offboardで、アームしているか</text>
<text x="460" y="638">now_us(): ノードの時計の値（マイクロ秒）</text>
<line x1="450" y1="654" x2="950" y2="654" stroke="#7a5aa6" stroke-width="1.2"/>
<text x="460" y="678">■ TF</text>
<text x="460" y="698">send_lidar_tf(): base_link → link を1回送る</text>
<line x1="450" y1="714" x2="950" y2="714" stroke="#7a5aa6" stroke-width="1.2"/>
<text x="460" y="738">■ 経路の計画（0.5秒ごと。補足2）</text>
<text x="460" y="758">request_plan(): 計画器に経路を頼む</text>
<text x="460" y="778">on_plan_accepted(future): 受け付けたら答えを待つ</text>
<text x="460" y="798">on_plan_result(future): 経路を覚える</text>
<line x1="450" y1="814" x2="950" y2="814" stroke="#7a5aa6" stroke-width="1.2"/>
<text x="460" y="838">■ 経路をたどる</text>
<text x="460" y="858">nearest_index(east, north): 最も近い点の番号</text>
<text x="460" y="878">lookahead_point(east, north): 1.0m先の点</text>
<text x="460" y="898">choose_target(east, north, up): 今の目標を決める</text>
<line x1="450" y1="914" x2="950" y2="914" stroke="#7a5aa6" stroke-width="1.2"/>
<text x="460" y="938">■ 段階を進める（0.1秒ごと。補足1）</text>
<text x="460" y="958">on_timer(): 目標を送り、段階を進める</text>
<text x="460" y="978">keep_landing(): Landまで送り直し、終える</text>
<rect x="20" y="154" width="330" height="80" rx="8" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<text x="185" y="178" text-anchor="middle" font-weight="bold">VehicleLocalPosition</text>
<text x="185" y="198" text-anchor="middle" font-size="13">/fmu/out/vehicle_local_position_v1</text>
<text x="185" y="218" text-anchor="middle" font-size="13">QoS: センサ向け（BEST_EFFORT）</text>
<rect x="20" y="264" width="330" height="80" rx="8" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<text x="185" y="288" text-anchor="middle" font-weight="bold">VehicleStatus</text>
<text x="185" y="308" text-anchor="middle" font-size="13">/fmu/out/vehicle_status_v1</text>
<text x="185" y="328" text-anchor="middle" font-size="13">QoS: センサ向け（BEST_EFFORT）</text>
<rect x="20" y="374" width="330" height="220" rx="8" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<text x="30" y="398" font-weight="bold">定数（ファイルの先頭）</text>
<line x1="20" y1="414" x2="350" y2="414" stroke="#c77d1a" stroke-width="1.2"/>
<text x="30" y="438">GOAL_ENU: 目的地（東8m, 北−6m）</text>
<text x="30" y="458">ALTITUDE: 飛ぶ高さ（3m）</text>
<text x="30" y="478">LOOKAHEAD: 目標にする先の距離（1m）</text>
<text x="30" y="498">REACHED_DIST: 着いた距離（0.5m）</text>
<text x="30" y="518">LIDAR_OFFSET: LiDARの位置</text>
<text x="30" y="538">PERIOD・PLAN_PERIOD: 周期</text>
<text x="30" y="558">REPLAN_LOG_DIFF: 引き直しのログ</text>
<text x="30" y="578">RETRY_CYCLES: 指示し直す間隔</text>
<rect x="1050" y="154" width="340" height="80" rx="8" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<text x="1220" y="178" text-anchor="middle" font-weight="bold">OffboardControlMode</text>
<text x="1220" y="198" text-anchor="middle" font-size="13">/fmu/in/offboard_control_mode</text>
<text x="1220" y="218" text-anchor="middle" font-size="13">QoS: 既定（10）。合図</text>
<rect x="1050" y="258" width="340" height="80" rx="8" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<text x="1220" y="282" text-anchor="middle" font-weight="bold">TrajectorySetpoint</text>
<text x="1220" y="302" text-anchor="middle" font-size="13">/fmu/in/trajectory_setpoint</text>
<text x="1220" y="322" text-anchor="middle" font-size="13">QoS: 既定（10）。目標の位置</text>
<rect x="1050" y="362" width="340" height="80" rx="8" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<text x="1220" y="386" text-anchor="middle" font-weight="bold">VehicleCommand</text>
<text x="1220" y="406" text-anchor="middle" font-size="13">/fmu/in/vehicle_command</text>
<text x="1220" y="426" text-anchor="middle" font-size="13">QoS: 既定（10）。切り替え・アーム等</text>
<rect x="1050" y="466" width="340" height="140" rx="8" fill="#eef7ee" stroke="#3a8a3a" stroke-width="1.5"/>
<text x="1060" y="490" font-weight="bold">TF（座標系の位置関係）</text>
<line x1="1050" y1="506" x2="1390" y2="506" stroke="#3a8a3a" stroke-width="1.2"/>
<text x="1060" y="530">map → base_link: 位置が届くたび</text>
<text x="1060" y="550">（tf_pub。向きだけ入れる）</text>
<text x="1060" y="570">base_link → link: 起動時に1回</text>
<text x="1060" y="590">（static_tf_pub。動かないTF）</text>
<rect x="1050" y="630" width="340" height="140" rx="8" fill="#eef7ee" stroke="#3a8a3a" stroke-width="1.5"/>
<text x="1060" y="654" font-weight="bold">planner_server（Nav2）</text>
<line x1="1050" y1="670" x2="1390" y2="670" stroke="#3a8a3a" stroke-width="1.2"/>
<text x="1060" y="694">アクション compute_path_to_pose</text>
<text x="1060" y="714">頼み: 目的地（GOAL_ENU）</text>
<text x="1060" y="734">答え: 経路（nav_msgs/msg/Path）</text>
<text x="1060" y="754">　　　と error_code</text>
<rect x="1050" y="794" width="340" height="140" rx="8" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<text x="1060" y="818" font-weight="bold">関数（クラスの外）</text>
<line x1="1050" y1="834" x2="1390" y2="834" stroke="#c77d1a" stroke-width="1.2"/>
<text x="1060" y="858">enu_to_ned()・enu_yaw_to_ned():</text>
<text x="1060" y="878">　ENUをNEDに直す（フェーズ3から読み込む）</text>
<text x="1060" y="898">yaw_to_quaternion(): 向きを回転の形に</text>
<text x="1060" y="918">path_length(): 経路の長さ</text>
<rect x="450" y="1034" width="500" height="380" rx="8" fill="#fffbe6" stroke="#b59f3b" stroke-width="1.5"/>
<text x="460" y="1058" font-weight="bold">補足1: on_timer の流れ（0.1秒ごと）</text>
<line x1="450" y1="1074" x2="950" y2="1074" stroke="#b59f3b" stroke-width="1.2"/>
<text x="460" y="1098">1. 位置・状態と、最初の経路が届くまでは何もしない</text>
<text x="460" y="1118">2. 着陸を指示した後は、keep_landing だけを行う</text>
<text x="460" y="1138">3. choose_target で目標を決め、合図と目標を送る</text>
<text x="460" y="1158">　 上昇中は離陸した地点の真上、その後は1.0m先の点</text>
<text x="460" y="1178">4. Offboardでアームするまで、1秒ごとに指示し直す</text>
<text x="460" y="1198">5. 一度Offboardになった後に抜けたら、終える</text>
<text x="460" y="1218">6. 目的地まで0.5m以内なら、着陸を指示する</text>
<line x1="450" y1="1234" x2="950" y2="1234" stroke="#b59f3b" stroke-width="1.2"/>
<text x="460" y="1258">補足2: 計画の流れ（0.5秒ごと）</text>
<line x1="450" y1="1274" x2="950" y2="1274" stroke="#b59f3b" stroke-width="1.2"/>
<text x="460" y="1298">1. request_plan: 答えを待っていなければ頼む</text>
<text x="460" y="1318">2. on_plan_accepted: 断られたら、次の0.5秒を待つ</text>
<text x="460" y="1338">3. on_plan_result: 経路を path に入れ替える</text>
<text x="460" y="1358">　 失敗したら path を空にし、機体はその場で止まる</text>
<text x="460" y="1378">　 残りの長さが3m以上変われば「引き直した」と出す</text>
<text x="460" y="1398">→ 次の on_timer から、新しい経路の1.0m先を目標にする</text>
<text x="708" y="122" text-anchor="start" font-size="13">受け継ぐ</text>
<text x="400" y="186" text-anchor="middle" font-size="13">購読</text>
<text x="400" y="296" text-anchor="middle" font-size="13">購読</text>
<text x="400" y="426" text-anchor="middle" font-size="13">読む</text>
<text x="1000" y="186" text-anchor="middle" font-size="13">送る</text>
<text x="1000" y="290" text-anchor="middle" font-size="13">送る</text>
<text x="1000" y="394" text-anchor="middle" font-size="13">送る</text>
<text x="1000" y="528" text-anchor="middle" font-size="13">TFを送る</text>
<text x="1000" y="652" text-anchor="middle" font-size="13">経路を頼む</text>
<text x="1000" y="702" text-anchor="middle" font-size="13">経路を返す</text>
<text x="1000" y="836" text-anchor="middle" font-size="13">使う</text>
<text x="20" y="1476" text-anchor="start" font-size="13">実線の矢印: 購読する・送る・頼む　点線の矢印: 読む・使う　白い三角の矢印: 受け継ぐ　点線（矢印なし）: 補足</text>
<rect x="20" y="1435" width="20" height="14" rx="3" fill="#f3eefa" stroke="#7a5aa6" stroke-width="1.5"/>
<text x="48" y="1448">ROS 2のクラス</text>
<rect x="190" y="1435" width="20" height="14" rx="3" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<text x="218" y="1448">px4_msgs の型とトピック</text>
<rect x="440" y="1435" width="20" height="14" rx="3" fill="#eef7ee" stroke="#3a8a3a" stroke-width="1.5"/>
<text x="468" y="1448">TF・Nav2の計画器</text>
<rect x="640" y="1435" width="20" height="14" rx="3" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<text x="668" y="1448">定数・関数</text>
<rect x="890" y="1435" width="20" height="14" rx="3" fill="#fffbe6" stroke="#b59f3b" stroke-width="1.5"/>
<text x="918" y="1448">補足</text>
</g></svg>
