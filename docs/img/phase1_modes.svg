<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 380" width="1110" height="380" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="1回の飛行での、飛行モードとアームの移り変わり。地上でディスアームの状態から、離陸の指示でアームしてTakeoffになり、決めた高さに着くとHoldになる。Holdのまま、Go to locationで止まる位置を移せる。Holdから、着陸の指示でLandになり、帰還の指示でReturnになる。Landは、着地すると着陸を検知して自動でディスアームする。Returnは、ホームの位置へ戻って着陸し、同じように自動でディスアームする">
<title>1回の飛行での、飛行モードとアームの移り変わり。地上でディスアームの状態から、離陸の指示でアームしてTakeoffになり、決めた高さに着くとHoldになる。Holdのまま、Go to locationで止まる位置を移せる。Holdから、着陸の指示でLandになり、帰還の指示でReturnになる。Landは、着地すると着陸を検知して自動でディスアームする。Returnは、ホームの位置へ戻って着陸し、同じように自動でディスアームする</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#333333"/></marker></defs>
<rect x="0" y="0" width="1110" height="380" fill="#ffffff"/>
<g fill="#1a1a1a">
<path d="M220,75 L310,75" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M510,75 L600,75" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M800,75 L890,75" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M700,130 L700,210" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M600,265 L220,265" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M990,130 L990,360 L120,360 L120,320" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M120,210 L120,130" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="20" y="20" width="200" height="110" rx="8" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<rect x="310" y="20" width="200" height="110" rx="8" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<rect x="600" y="20" width="200" height="110" rx="8" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<rect x="890" y="20" width="200" height="110" rx="8" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<rect x="600" y="210" width="200" height="110" rx="8" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<rect x="20" y="210" width="200" height="110" rx="8" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<text x="120" y="69" text-anchor="middle" font-weight="bold">地上</text>
<text x="120" y="89" text-anchor="middle">ディスアーム</text>
<text x="410" y="59" text-anchor="middle" font-weight="bold">Takeoff</text>
<text x="410" y="79" text-anchor="middle">アームして上昇し</text>
<text x="410" y="99" text-anchor="middle">決めた高さで止まる</text>
<text x="700" y="49" text-anchor="middle" font-weight="bold">Hold</text>
<text x="700" y="69" text-anchor="middle">その場で止まる</text>
<text x="700" y="89" text-anchor="middle">Go to locationで</text>
<text x="700" y="109" text-anchor="middle">止まる位置を移す</text>
<text x="990" y="59" text-anchor="middle" font-weight="bold">Return</text>
<text x="990" y="79" text-anchor="middle">ホームの位置へ</text>
<text x="990" y="99" text-anchor="middle">戻って着陸する</text>
<text x="700" y="249" text-anchor="middle" font-weight="bold">Land</text>
<text x="700" y="269" text-anchor="middle">その場に</text>
<text x="700" y="289" text-anchor="middle">着陸する</text>
<text x="120" y="249" text-anchor="middle" font-weight="bold">着陸を検知</text>
<text x="120" y="269" text-anchor="middle">少し後に</text>
<text x="120" y="289" text-anchor="middle">自動でディスアーム</text>
<text x="265" y="67" text-anchor="middle" font-size="13">離陸の指示</text>
<text x="555" y="67" text-anchor="middle" font-size="13">高さに着く</text>
<text x="845" y="67" text-anchor="middle" font-size="13">帰還の指示</text>
<text x="708" y="175" text-anchor="start" font-size="13">着陸の指示</text>
<text x="410" y="257" text-anchor="middle" font-size="13">着地</text>
<text x="555" y="352" text-anchor="middle" font-size="13">着地</text>
<text x="128" y="175" text-anchor="start" font-size="13">次の飛行へ</text>
</g></svg>
