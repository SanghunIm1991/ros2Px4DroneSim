<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 830" width="1260" height="830" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="マルチコプターの制御の連鎖を、uORBのトピックの名前で追う図。navigator が position_setpoint_triplet を flight_mode_manager に渡し、flight_mode_manager が trajectory_setpoint を mc_pos_control に渡す。Offboardのときは、ROS 2のノードの目標が uXRCE-DDS で uxrce_dds_client に届き、uxrce_dds_client が trajectory_setpoint を出す。ekf2 は vehicle_local_position を mc_pos_control に、vehicle_attitude を mc_att_control に渡す。mc_pos_control は vehicle_attitude_setpoint を mc_att_control に、mc_att_control は vehicle_rates_setpoint を mc_rate_control に渡す。sensors は vehicle_angular_velocity を mc_rate_control に、vehicle_imu 等を ekf2 に渡す。mc_rate_control は vehicle_torque_setpoint と vehicle_thrust_setpoint を control_allocator に渡し、control_allocator は actuator_motors を gz_bridge に渡す。gz_bridge は Gazebo とやり取りし、sensor_gyro・sensor_accel 等を sensors に渡す">
<title>マルチコプターの制御の連鎖を、uORBのトピックの名前で追う図。navigator が position_setpoint_triplet を flight_mode_manager に渡し、flight_mode_manager が trajectory_setpoint を mc_pos_control に渡す。Offboardのときは、ROS 2のノードの目標が uXRCE-DDS で uxrce_dds_client に届き、uxrce_dds_client が trajectory_setpoint を出す。ekf2 は vehicle_local_position を mc_pos_control に、vehicle_attitude を mc_att_control に渡す。mc_pos_control は vehicle_attitude_setpoint を mc_att_control に、mc_att_control は vehicle_rates_setpoint を mc_rate_control に渡す。sensors は vehicle_angular_velocity を mc_rate_control に、vehicle_imu 等を ekf2 に渡す。mc_rate_control は vehicle_torque_setpoint と vehicle_thrust_setpoint を control_allocator に渡し、control_allocator は actuator_motors を gz_bridge に渡す。gz_bridge は Gazebo とやり取りし、sensor_gyro・sensor_accel 等を sensors に渡す</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#333333"/></marker></defs>
