<rect x="20" y="150" width="260" height="70" rx="8" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<rect x="500" y="150" width="260" height="70" rx="8" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<rect x="980" y="150" width="260" height="70" rx="8" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<rect x="500" y="280" width="260" height="70" rx="8" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<rect x="20" y="410" width="260" height="70" rx="8" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<rect x="500" y="410" width="260" height="70" rx="8" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
