<text x="150" y="49" text-anchor="middle" font-weight="bold">navigator</text>
<text x="150" y="69" text-anchor="middle">自動のモードの目標</text>
<text x="630" y="49" text-anchor="middle" font-weight="bold">flight_mode_manager</text>
<text x="630" y="69" text-anchor="middle">飛行モードの目標（FlightTask）</text>
<text x="1110" y="49" text-anchor="middle" font-weight="bold">ROS 2のノード</text>
<text x="1110" y="69" text-anchor="middle">Offboardのときの目標</text>
<text x="150" y="179" text-anchor="middle" font-weight="bold">ekf2</text>
<text x="150" y="199" text-anchor="middle">位置・速度・姿勢の推定</text>
<text x="630" y="179" text-anchor="middle" font-weight="bold">mc_pos_control</text>
<text x="630" y="199" text-anchor="middle">位置と速度の制御</text>
<text x="1110" y="179" text-anchor="middle" font-weight="bold">uxrce_dds_client</text>
<text x="1110" y="199" text-anchor="middle">uORBの外との出入口</text>
<text x="630" y="309" text-anchor="middle" font-weight="bold">mc_att_control</text>
<text x="630" y="329" text-anchor="middle">姿勢の制御</text>
<text x="150" y="439" text-anchor="middle" font-weight="bold">sensors</text>
<text x="150" y="459" text-anchor="middle">センサの値を整える</text>
<text x="630" y="439" text-anchor="middle" font-weight="bold">mc_rate_control</text>
<text x="630" y="459" text-anchor="middle">角速度の制御</text>
<text x="150" y="569" text-anchor="middle" font-weight="bold">gz_bridge</text>
<text x="150" y="589" text-anchor="middle">Gazeboとの中継（SITL）</text>
<text x="630" y="569" text-anchor="middle" font-weight="bold">control_allocator</text>
<text x="630" y="589" text-anchor="middle">各モーターへの配分</text>
<text x="150" y="699" text-anchor="middle" font-weight="bold">Gazebo</text>
<text x="150" y="719" text-anchor="middle">機体とセンサの計算</text>
<text x="390" y="47" text-anchor="middle" font-size="13">position_setpoint_triplet</text>
<text x="390" y="177" text-anchor="middle" font-size="13">vehicle_local_position</text>
<text x="870" y="177" text-anchor="middle" font-size="13">trajectory_setpoint</text>
<text x="390" y="437" text-anchor="middle" font-size="13">vehicle_angular_velocity</text>
<text x="390" y="567" text-anchor="middle" font-size="13">actuator_motors</text>
<text x="638" y="125" text-anchor="start" font-size="13">trajectory_setpoint</text>
<text x="638" y="255" text-anchor="start" font-size="13">vehicle_attitude_setpoint</text>
<text x="638" y="385" text-anchor="start" font-size="13">vehicle_rates_setpoint</text>
<text x="638" y="507" text-anchor="start" font-size="13">vehicle_torque_setpoint</text>
<text x="638" y="525" text-anchor="start" font-size="13">vehicle_thrust_setpoint</text>
<text x="1118" y="125" text-anchor="start" font-size="13">uXRCE-DDS</text>
<text x="390" y="307" text-anchor="middle" font-size="13">vehicle_attitude</text>
<text x="88" y="305" text-anchor="start" font-size="13">vehicle_imu 等</text>
<text x="158" y="515" text-anchor="start" font-size="13">sensor_gyro・sensor_accel 等</text>
<text x="158" y="645" text-anchor="start" font-size="13">Gazeboの通信</text>
<text x="630" y="790" text-anchor="middle" font-size="13">矢印のラベルは、uORBのトピックの名前（「Gazeboの通信」と「uXRCE-DDS」を除く）</text>
<text x="630" y="812" text-anchor="middle" font-size="13">Offboardのときは、flight_mode_manager の代わりに uxrce_dds_client が trajectory_setpoint を出す</text>
<rect x="500" y="677" width="20" height="14" rx="3" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
<text x="528" y="690">PX4のモジュール</text>
<rect x="500" y="707" width="20" height="14" rx="3" fill="#f3eefa" stroke="#7a5aa6" stroke-width="1.5"/>
