<path d="M150,540 L150,480" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M150,610 L150,670" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#s)"/>
<rect x="20" y="20" width="260" height="70" rx="8" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
