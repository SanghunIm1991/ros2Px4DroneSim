<text x="495" y="234" text-anchor="middle" font-weight="bold">Micro XRCE-DDS Agent</text>
<text x="495" y="254" text-anchor="middle">PX4のデータを</text>
<text x="495" y="274" text-anchor="middle">ROS 2へ中継する</text>
<text x="495" y="296" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ2</text>
