<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 520" width="1110" height="520" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="1台のPCの中のSITLの構成。QGroundControlとPX4（SITL）はMAVLinkでつながる。PX4はGazeboにモーターの回転を送り、Gazeboはセンサの値を返す。PX4とROS 2の間は、Micro XRCE-DDS Agent（フェーズ2）がuXRCE-DDSで中継する。Gazeboの値は、ros_gz_bridge（フェーズ4）がROS 2へ中継する。ROS 2の側には、ros2 topic・自作のノード・RViz2がある（フェーズ2〜6）">
<title>1台のPCの中のSITLの構成。QGroundControlとPX4（SITL）はMAVLinkでつながる。PX4はGazeboにモーターの回転を送り、Gazeboはセンサの値を返す。PX4とROS 2の間は、Micro XRCE-DDS Agent（フェーズ2）がuXRCE-DDSで中継する。Gazeboの値は、ros_gz_bridge（フェーズ4）がROS 2へ中継する。ROS 2の側には、ros2 topic・自作のノード・RViz2がある（フェーズ2〜6）</title>
