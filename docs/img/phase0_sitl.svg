<rect x="20" y="20" width="230" height="120" rx="8" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<rect x="380" y="20" width="230" height="120" rx="8" fill="#eaf2ff" stroke="#3b6fb6" stroke-width="1.5"/>
