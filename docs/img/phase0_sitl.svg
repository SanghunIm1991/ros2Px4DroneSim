<text x="135" y="74" text-anchor="middle">地上局。地図で見て</text>
<text x="135" y="94" text-anchor="middle">離陸や移動を指示する</text>
<text x="135" y="116" text-anchor="middle" fill="#9a3412" font-weight="bold">環境構築・フェーズ1</text>
<text x="495" y="54" text-anchor="middle" font-weight="bold">PX4（SITL）</text>
<text x="495" y="74" text-anchor="middle">PCの上で動く</text>
<text x="495" y="94" text-anchor="middle">フライトコントローラ</text>
