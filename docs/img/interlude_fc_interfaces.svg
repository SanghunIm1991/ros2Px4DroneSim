<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 510" width="1070" height="510" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="PX4と自作のソフトウェアをつなぐインターフェース。中央のPX4（フライトコントローラ）と、左の地上局・MAVSDKのアプリはMAVLinkで、右のコンパニオンコンピュータのROS 2のノードはuXRCE-DDS（px4_msgs）でつながる。上のPX4の中の自作のモジュールはuORBで、下のモーター・サーボ・センサはPWM・DShot・CAN・シリアル等でつながる">
<title>PX4と自作のソフトウェアをつなぐインターフェース。中央のPX4（フライトコントローラ）と、左の地上局・MAVSDKのアプリはMAVLinkで、右のコンパニオンコンピュータのROS 2のノードはuXRCE-DDS（px4_msgs）でつながる。上のPX4の中の自作のモジュールはuORBで、下のモーター・サーボ・センサはPWM・DShot・CAN・シリアル等でつながる</title>
