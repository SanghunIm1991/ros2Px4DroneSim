<text x="155" y="69" text-anchor="middle" font-weight="bold">QGroundControl（T2）</text>
<text x="155" y="89" text-anchor="middle">機体の状態を見守る</text>
<text x="155" y="109" text-anchor="middle">途中で止める（Land）</text>
<text x="675" y="69" text-anchor="middle" font-weight="bold">PX4（SITL。T1）</text>
<text x="675" y="89" text-anchor="middle">位置を推定し、目標へ</text>
<text x="675" y="109" text-anchor="middle">飛ぶようにモーターを回す</text>
<text x="1195" y="69" text-anchor="middle" font-weight="bold">Gazebo（T1）</text>
<text x="1195" y="89" text-anchor="middle">機体の動きと</text>
<text x="1195" y="109" text-anchor="middle">センサの値を計算する</text>
<text x="675" y="299" text-anchor="middle" font-weight="bold">Micro XRCE-DDS Agent（T3）</text>
<text x="675" y="319" text-anchor="middle">PX4とROS 2の間で</text>
<text x="675" y="339" text-anchor="middle">トピックを中継する</text>
<text x="1195" y="299" text-anchor="middle" font-weight="bold">parameter_bridge（T4）</text>
<text x="1195" y="319" text-anchor="middle">LiDARの値を /scan にし</text>
<text x="1195" y="339" text-anchor="middle">時刻を付け替える</text>
<text x="155" y="539" text-anchor="middle" font-weight="bold">学習者</text>
<text x="155" y="559" text-anchor="middle">目的地を決め、計画器を</text>
<text x="155" y="579" text-anchor="middle">有効にし、必要なら止める</text>
<text x="675" y="539" text-anchor="middle" font-weight="bold">replan_flight（T6）</text>
<text x="675" y="559" text-anchor="middle">位置からTFを作り</text>
<text x="675" y="579" text-anchor="middle">経路の1.0m先を目標にする</text>
<text x="1195" y="539" text-anchor="middle" font-weight="bold">planner_server（T5）</text>
<text x="1195" y="559" text-anchor="middle">/scan とTFで地図を作り</text>
<text x="1195" y="579" text-anchor="middle">経路を計画する</text>
<text x="415" y="57" text-anchor="middle" font-size="13" fill="#6b6b6b">機体の状態（MAVLink）</text>
<text x="415" y="107" text-anchor="middle" font-size="13" fill="#c62828">モードの切り替え（Land 等）</text>
<text x="935" y="57" text-anchor="middle" font-size="13" fill="#1a1a1a">モーターの回転数の指令</text>
<text x="935" y="107" text-anchor="middle" font-size="13" fill="#6b6b6b">IMU・GPS・LiDAR等の値</text>
<text x="627" y="205" text-anchor="end" font-size="13" fill="#6b6b6b">機体の位置・状態</text>
<text x="723" y="205" text-anchor="start" font-size="13" fill="#1a1a1a">合図・目標・指令</text>
<text x="627" y="435" text-anchor="end" font-size="13" fill="#6b6b6b">/fmu/out/…（位置・状態）</text>
<text x="723" y="435" text-anchor="start" font-size="13" fill="#1a1a1a">/fmu/in/…（合図・目標・指令）</text>
<text x="1203" y="205" text-anchor="start" font-size="13" fill="#6b6b6b">LiDARの値</text>
<text x="1203" y="435" text-anchor="start" font-size="13" fill="#6b6b6b">/scan</text>
<text x="415" y="547" text-anchor="middle" font-size="13" fill="#c62828">目的地（GOAL_ENU）</text>
<text x="935" y="512" text-anchor="middle" font-size="13" fill="#1a1a1a">経路を頼む（目的地）</text>
<text x="935" y="557" text-anchor="middle" font-size="13" fill="#6b6b6b">TF（map→base_link→link）</text>
<text x="935" y="602" text-anchor="middle" font-size="13" fill="#1a1a1a">経路（Path）</text>
<text x="163" y="320" text-anchor="start" font-size="13" fill="#c62828">操作（Land 等）</text>
<text x="675" y="690" text-anchor="middle" font-size="13" fill="#c62828">計画器の設定・有効化（ros2 lifecycle。T8）</text>
<text x="70" y="760" text-anchor="start" font-size="13">ユーザーの指令値</text>
<text x="300" y="760" text-anchor="start" font-size="13">センサの値</text>
<text x="490" y="760" text-anchor="start" font-size="13">ソフトウェアの指令値</text>
