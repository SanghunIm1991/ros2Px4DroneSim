<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 780" width="1350" height="780" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="フェーズ6の最終形の、代表的なデータの流れ。線は3種類で、ユーザーの指令値、センサの値、ソフトウェアの指令値に分けてある。ユーザーの指令値: 学習者が、目的地（GOAL_ENU）を自作のノード replan_flight のコードに書き、ros2 lifecycle で計画器 planner_server を設定・有効化し、途中で止めるときは QGroundControl から PX4 へ Land 等のモードの切り替えを送る。センサの値: Gazebo が計算した IMU・GPS・LiDAR 等の値を PX4 が受け取り、PX4 は機体の状態を QGroundControl へ、機体の位置・状態を Micro XRCE-DDS Agent を通して /fmu/out のトピックで replan_flight へ送る。replan_flight は位置から TF を作って planner_server へ送る。Gazebo の LiDAR の値は parameter_bridge が /scan にして planner_server へ送る。ソフトウェアの指令値: replan_flight が planner_server に経路を頼み、planner_server が経路を返す。replan_flight は合図・目標・指令を /fmu/in のトピックで Agent を通して PX4 へ送り、PX4 はモーターの回転数の指令を Gazebo へ送る">
<title>フェーズ6の最終形の、代表的なデータの流れ。線は3種類で、ユーザーの指令値、センサの値、ソフトウェアの指令値に分けてある。ユーザーの指令値: 学習者が、目的地（GOAL_ENU）を自作のノード replan_flight のコードに書き、ros2 lifecycle で計画器 planner_server を設定・有効化し、途中で止めるときは QGroundControl から PX4 へ Land 等のモードの切り替えを送る。センサの値: Gazebo が計算した IMU・GPS・LiDAR 等の値を PX4 が受け取り、PX4 は機体の状態を QGroundControl へ、機体の位置・状態を Micro XRCE-DDS Agent を通して /fmu/out のトピックで replan_flight へ送る。replan_flight は位置から TF を作って planner_server へ送る。Gazebo の LiDAR の値は parameter_bridge が /scan にして planner_server へ送る。ソフトウェアの指令値: replan_flight が planner_server に経路を頼み、planner_server が経路を返す。replan_flight は合図・目標・指令を /fmu/in のトピックで Agent を通して PX4 へ送り、PX4 はモーターの回転数の指令を Gazebo へ送る</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#333333"/></marker><marker id="f_user" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="f_sensor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker><marker id="f_cmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
